<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#080c14">
  <title>Password reset · Incoming 2.0</title>
  <link rel="icon" type="image/png" href="/incoming.png">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header><img src="/incoming.png" width="48" height="48" alt=""><span>Incoming 2.0</span></header>
    <section aria-labelledby="heading">
      <h1 id="heading" tabindex="-1">Reset your password</h1>
      <p id="description">Enter the email address associated with your Incoming account.</p>
      <noscript><p>Enable JavaScript to request or use a password reset link.</p></noscript>
      <form id="request" method="post" hidden>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="254" required>
        <button type="submit">Send reset link</button>
      </form>
      <form id="reset" method="post" hidden>
        <label for="password">New password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="200" aria-describedby="password-hint" required>
        <small id="password-hint">Use at least 12 characters.</small>
        <label for="confirm">Confirm new password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="200" required>
        <button type="submit">Save password</button>
      </form>
      <p id="error" role="alert" hidden></p>
      <button id="restart" type="button" class="secondary" hidden>Request another link</button>
    </section>
  </main>
</body>
</html>
